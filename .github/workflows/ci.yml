# ============================================================================
# Bank Management System - CI pipeline
# Trigger: EVERY push and EVERY pull request.
# Steps:   MySQL 8 service -> import schema -> build C++ backend -> boot API
#          -> run the integration test suite (tests/integration).
# ============================================================================
name: build-and-integration-tests

on:
  push:
  pull_request:

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: root
      DB_NAME: bank_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build & test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make mysql-client libmysqlclient-dev \
            || sudo apt-get install -y default-libmysqlclient-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/requirements.txt

      - name: Import database schema and seed data
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < database/seed.sql

      - name: Build backend (g++ / Make)
        run: make -C backend

      - name: Start API server
        run: |
          ./backend/bank_server &> /tmp/server.log &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health || { cat /tmp/server.log; exit 1; }

      - name: Run integration tests (push / PR gate)
        # TODO(team): remove `continue-on-error` once all 12 endpoints are
        # implemented. Until then, unimplemented endpoints answer 501 and are
        # reported as skipped, so the pipeline stays green on the template.
        continue-on-error: true
        run: python3 -m pytest -q tests/integration

      - name: Upload server log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/server.log
